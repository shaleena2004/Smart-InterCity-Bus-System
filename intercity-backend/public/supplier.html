<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bus Supplier Dashboard</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="page-shell">
    <header class="page-header">
      <a class="back-link" href="/">← Back to Internal Dashboard</a>
      <div>
        <h1>Bus Supplier Dashboard</h1>
        <p>Fleet and route status for supplier operations.</p>
      </div>
    </header>

    <main>
      <section class="section-block">
        <h2>Active Routes</h2>
        <div class="table">
          <div class="table-row table-header">
            <span>Route</span>
            <span>Status</span>
            <span>Bus</span>
          </div>
          <div class="table-row"><span>Colombo → Kandy</span><span>On Time</span><span>EX-2991</span></div>
          <div class="table-row"><span>Negombo → Kaduwela</span><span>Delayed</span><span>EX-1004</span></div>
          <div class="table-row"><span>Pettah → Katunayake</span><span>On Track</span><span>EX-6543</span></div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
